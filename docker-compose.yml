services:

  db:
    image: mysql:8.4
    container_name: moviehub_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - moviehub_network

  backend:
    build:
      context: ./Backend
    container_name: moviehub_backend
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - moviehub_network

  frontend:
    build:
      context: ./frontend
    container_name: moviehub_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - moviehub_network

  nginx:
    image: nginx:alpine
    container_name: moviehub_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - moviehub_network

volumes:
  mysql_data:

networks:
  moviehub_network:
    driver: bridge
